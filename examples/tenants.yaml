# Multi-tenant batch config for `licenselens batch tenants.yaml -o reports`
#
# Default packs are identity + endpoint. Email is off by default
# (no Graph API for MDO policy config). Pass allow_email_proxy only when
# you explicitly want the labeled Secure Score degraded path.
#
# Keys `run_batch` reads (top-level defaults merge into each tenant; per-tenant wins):
#   defaults                 top-level map applied to every tenant
#   slug                     report directory name (falls back to tenant_id)
#   tenant_id                Entra tenant GUID (alias: azure_tenant_id)
#   azure_tenant_id          alias for tenant_id
#   auth / auth_mode         aliases: dry_run|dry-run|device|device_code|device-code|
#                            client_secret|client-secret|clientsecret|azure_cli|azure-cli|cli
#   client_id                app registration id (else AZURE_CLIENT_ID)
#   client_secret            do not commit real values; prefer AZURE_CLIENT_SECRET env
#   packs                    list or comma-separated pack ids
#   allow_email_proxy        opt into labeled Secure Score email path
#   profile                  assessment profile id
#   config                   path to a custom profile/config YAML
#   rules                    path to extra rules YAML
#   backend / backends       collector backends (string or list)
#   report_archive           write security-license-lens-report.zip
#   workspace_resource_id    Sentinel workspace ARM id
#   discover_workspaces      auto-select only when exactly one Sentinel workspace exists
#
# Do not commit real client_secret values; prefer AZURE_CLIENT_SECRET env.

defaults:
  auth: client_secret
  # packs: [identity, endpoint]   # optional; matches product default
  # allow_email_proxy: false
  # profile: identity
  # config: ./profiles/custom.yaml
  # rules: ./rules/extra.yaml
  # backend: graph              # or backends: [graph, arm]
  # report_archive: false

tenants:
  - slug: contoso
    tenant_id: "00000000-0000-0000-0000-000000000001"
    # azure_tenant_id is an alias for tenant_id
    # client_id / client_secret from env AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
    # or set per-tenant:
    # client_id: "..."
    # client_secret: "..."   # do not commit real values; prefer AZURE_CLIENT_SECRET env
    # auth_mode: client_secret   # aliases: dry_run|dry-run|device|device_code|device-code|client_secret|client-secret|clientsecret|azure_cli|azure-cli|cli
    # backends: [graph, arm]
    # report_archive: false
    # discover_workspaces: true  # auto-select only when exactly one Sentinel workspace exists

  - slug: fabrikam
    tenant_id: "00000000-0000-0000-0000-000000000002"
    # packs: [identity, endpoint]
    # workspace_resource_id: "/subscriptions/.../workspaces/..."
