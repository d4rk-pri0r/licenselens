site_name: Security License Lens
site_description: Detect Microsoft security configuration debt — the paid capabilities you leave unused.
site_url: https://d4rk-pri0r.github.io/licenselens/
repo_url: https://github.com/d4rk-pri0r/licenselens
repo_name: d4rk-pri0r/licenselens
edit_uri: ""

# Fail the build on any warning (broken links, missing anchors, etc.).
strict: true

docs_dir: docs

nav:
  - Home: index.md
  - Product overview: package-readme.md
  - Start here:
    - Operator guide: operator-guide.md
    - Install and run your first scan: getting-started.md
    - Read a report: report-guide.md
    - What LicenseLens does: concepts.md
  - Operate:
      - Command-line commands: cli.md
      - Connect a Microsoft tenant: app-registration.md
      - Scan multiple tenants: msp-batch.md
      - Reports and exports: report.md
      - Data sources and backends: collectors.md
      - Use with AI assistants: mcp.md
      - Import Maester results: maester.md
      - Run the offline demo: conference-demo.md
  - Understand:
      - How the assessment works: methodology/assessment-model.md
      - How evidence is judged: methodology/evidence-model.md
      - How licensing maps to capabilities: methodology/entitlement-model.md
      - How the score is calculated: methodology/scoring.md
      - What unknown and incomplete mean: methodology/uncertainty.md
      - How we validate the product: methodology/validation.md
      - Limits and caveats: methodology/limitations.md
      - Compare with other tools: comparison.md
      - Priority checks: flagships.md
      - Independent practitioner review: practitioner-validation.md
      - Record validation results: validation-recording.md
  - Extend:
      - How the software fits together: component-map.md
      - System architecture: architecture.md
      - Add a new check: adding-a-check.md
      - Customize scans: profiles.md
      - Required permissions: permissions.md
      - Contribute to the project: contributing.md
  - Reference:
      - Browse the checks: checks.md
      - Reference overview: reference/index.md
      - Every check in detail: reference/checks.md
      - Capability catalog: reference/capabilities.md
      - Profile reference: reference/profiles.md
      - Permission reference: reference/permissions.md
      - Coverage map: reference/coverage.md
  - Platform and project:
      - Windows installation: windows.md
      - Security policy: security.md
      - Product limitations: limitations.md
      - Support and compatibility: support.md
      - Release history: releases.md
      - Release the Python package: releasing-python-only.md
      - Demo materials:
          - Offline demo kit: hotel-room.md
      - Booth one-pager: booth-onepager.md

theme:
  name: material
  font: false
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section

plugins:
  - search

# Fail the build when internal links or anchors are broken. The `strict` flag
# above promotes every `warn` to an error, so a broken internal link, an
# unrecognized link, or a dangling anchor fails `mkdocs build`.
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

# Internal validation checklists stay out of the public site (and out of the
# "pages not in nav" warning surface).
exclude_docs: |
  lab-seed-checklist.md
  manual-test-checklist.md
  tenant-provisioning-guide.md
  work-package-template.md

extra_css:
  - stylesheets/extra.css

copyright: "Security License Lens is an independent open-source project, not affiliated with Microsoft."
