[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "licenselens"
version = "0.4.0"
description = "Security License Lens — detect Microsoft security configuration debt: capabilities you pay for but leave unused."
readme = "docs/package-readme.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "d4rk-pri0r" }]
keywords = [
  "microsoft",
  "entra",
  "defender",
  "sentinel",
  "purview",
  "security",
  "license",
  "graph",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "azure-identity>=1.19.0",
  "dnspython>=2.6,<3",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "pydantic>=2.9.0",
  "pyyaml>=6.0.2",
  "rich>=13.9.0",
  "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "html5lib>=1.1,<2",
  "playwright>=1.61,<2",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "pytest-playwright>=0.7,<1",
  "ruff>=0.6.0",
]
docs = [
  "codespell==2.4.3",
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
]
build-windows = [
  "pyinstaller==6.22.0",
]

[project.urls]
Homepage = "https://github.com/d4rk-pri0r/licenselens"
Documentation = "https://d4rk-pri0r.github.io/licenselens/"
Repository = "https://github.com/d4rk-pri0r/licenselens"
Issues = "https://github.com/d4rk-pri0r/licenselens/issues"

[project.scripts]
licenselens = "licenselens.cli:app"

[tool.hatch.build.targets.sdist]
# Package long description comes from docs/package-readme.md (see project.readme).
# Exclude the root README so the comparison-table exception never ships in sdist.
exclude = [
  "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/licenselens"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.wheel.force-include]
"catalog" = "licenselens/data/catalog"
"checks" = "licenselens/data/checks"
# Enumerate the live template tree only — the superseded v1 report partials
# (templates/report/_*.j2) were removed and must not ship in the wheel.
"templates/report.html.j2" = "licenselens/data/templates/report.html.j2"
"templates/report/v2" = "licenselens/data/templates/report/v2"
"templates/report_app" = "licenselens/data/templates/report_app"
"assets/vendor/microsoft-cloud" = "licenselens/data/vendor/microsoft-cloud"
# The PowerShell collector bridge (email/collaboration/power-data packs) is
# PowerShell-only data. Ship the runtime module — manifest, module body, entry
# script, and adapters — so pip/pipx installs can run it. The module's Pester
# tests must NOT ship (the release gate rejects any wheel member under tests/).
"powershell/LicenseLens.Collectors/LicenseLens.Collectors.psd1" = "licenselens/data/powershell/LicenseLens.Collectors/LicenseLens.Collectors.psd1"
"powershell/LicenseLens.Collectors/LicenseLens.Collectors.psm1" = "licenselens/data/powershell/LicenseLens.Collectors/LicenseLens.Collectors.psm1"
"powershell/LicenseLens.Collectors/Invoke-LicenseLensBridge.ps1" = "licenselens/data/powershell/LicenseLens.Collectors/Invoke-LicenseLensBridge.ps1"
"powershell/LicenseLens.Collectors/adapters" = "licenselens/data/powershell/LicenseLens.Collectors/adapters"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["browser: browser tests requiring Playwright/Chromium (run by the report-browser CI job)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/licenselens/cli.py" = ["B008"]
