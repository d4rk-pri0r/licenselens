[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "licenselens"
version = "0.3.0"
description = "Security License Lens — detect Microsoft security configuration debt: capabilities you pay for but leave unused."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "d4rk-pri0r" }]
keywords = [
  "microsoft",
  "entra",
  "defender",
  "sentinel",
  "purview",
  "security",
  "license",
  "graph",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "azure-identity>=1.19.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "pydantic>=2.9.0",
  "pyyaml>=6.0.2",
  "rich>=13.9.0",
  "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/d4rk-pri0r/licenselens"
Repository = "https://github.com/d4rk-pri0r/licenselens"
Issues = "https://github.com/d4rk-pri0r/licenselens/issues"

[project.scripts]
licenselens = "licenselens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/licenselens"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.wheel.force-include]
"catalog" = "licenselens/data/catalog"
"checks" = "licenselens/data/checks"
"templates" = "licenselens/data/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/licenselens/cli.py" = ["B008"]
