name: Windows CI

# Windows gates for the Python CLI, the PowerShell bridge, the frozen binary,
# the per-user installer, and the Chromium report. This is a *test* workflow:
# it never signs, publishes, or promotes anything. The frozen exe and its ZIP
# are deliberately unsigned and uploaded as short-lived `test-only` artifacts.
#
# Trust posture (locked by tests/test_windows_ci.py):
#   * every action is pinned by full commit SHA (no floating tags),
#   * least privilege: top-level `contents: read`, no `id-token`/`packages`,
#   * no repository secret expression anywhere, so a fork PR can never reach
#     signing or download credentials; production signing/promotion lives only
#     in the tag-gated release workflow (Todo 34) which runs on `push` to tags.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Provenance scan (tracked sources / workspace)
        run: |
          python scripts/provenance_scan.py --workspace --json -o provenance-workspace.json

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Pytest (non-browser)
        run: pytest tests/ -m "not browser" -q

      - name: Path / space / non-ASCII workspace smoke
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "sp acé 许可 lens"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Push-Location $dir
          try {
            python -m licenselens version
            if ($LASTEXITCODE -ne 0) { throw "version failed under a path with spaces + non-ASCII" }
            python -m licenselens checks
            if ($LASTEXITCODE -ne 0) { throw "checks failed under a path with spaces + non-ASCII" }
          }
          finally {
            Pop-Location
          }

  powershell:
    name: PowerShell bridge + installer (Pester)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 6.1.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -Force
          "Pester $(Get-Module Pester | Select-Object -ExpandProperty Version)"

      - name: PowerShell adapter contracts (Pester)
        shell: pwsh
        run: |
          Import-Module Pester -Force
          $result = Invoke-Pester -Path 'powershell/LicenseLens.Collectors/tests/LicenseLens.Collectors.Tests.ps1' -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "adapter contract failures: $($result.FailedCount)" }

      - name: Installer lifecycle (Pester)
        shell: pwsh
        run: |
          Import-Module Pester -Force
          $result = Invoke-Pester -Path 'packaging/windows/tests/Installer.Tests.ps1' -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { throw "installer lifecycle failures: $($result.FailedCount)" }

  pyinstaller:
    name: PyInstaller one-folder build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.12"

      - name: Install PyInstaller + runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build-windows]"

      - name: Build one-folder distribution
        run: pyinstaller --clean --noconfirm packaging/windows/licenselens.spec

      - name: Verify one-folder layout and unsigned test-only label
        shell: pwsh
        run: |
          $exe = "dist/licenselens/licenselens.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "missing exe: $exe" }
          $zip = Get-ChildItem "dist/licenselens-windows-x64-*-test-only.zip" | Select-Object -First 1
          if (-not $zip) { throw "missing test-only ZIP in dist/" }
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          if ($sig.Status -ne 'NotSigned') { throw "test artifact must be unsigned; status=$($sig.Status)" }
          "exe:      $exe"
          "zip:      $($zip.FullName)"
          "sig:      $($sig.Status) (test-only, unsigned)"

      - name: Provenance scan (built Windows artifacts)
        run: |
          python scripts/provenance_scan.py --artifacts --json -o provenance-windows-artifacts.json

      - name: Upload unsigned test-only artifact (expiring)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: licenselens-windows-x64-test-only
          path: dist/
          retention-days: 7
          if-no-files-found: error

  binary-smoke:
    name: Clean-path binary smoke
    needs: pyinstaller
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download unsigned test-only artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: licenselens-windows-x64-test-only
          path: dist

      - name: Smoke the frozen exe from a path with spaces + non-ASCII
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Lic en sé 许可\lens"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item -Recurse -Force "dist/licenselens" (Join-Path $dir "licenselens")
          & (Join-Path $dir "licenselens\licenselens.exe") version
          if ($LASTEXITCODE -ne 0) { throw "exe version failed under spaces + non-ASCII path" }
          & (Join-Path $dir "licenselens\licenselens.exe") checks
          if ($LASTEXITCODE -ne 0) { throw "exe checks failed under spaces + non-ASCII path" }

  report-browser:
    name: Chromium report test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.13"

      - name: Install package (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Run browser report tests
        run: pytest tests/test_report_browser.py --browser chromium --tracing=retain-on-failure -q

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-browser-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
