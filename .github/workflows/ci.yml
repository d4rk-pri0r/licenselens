name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Pytest with coverage
        run: pytest tests/ -m "not browser" --cov=licenselens --cov-report=term-missing --cov-fail-under=72 -q

      - name: Dry-run scan
        # Exit 1 means gaps/partial findings (expected in demo data)
        run: |
          set +e
          licenselens scan -o reports
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then exit "$code"; fi

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
          ls -la dist/

      - name: Smoke-test installed wheel
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/licenselens version
          /tmp/wheel-venv/bin/licenselens checks
          /tmp/wheel-venv/bin/licenselens diff --help
          /tmp/wheel-venv/bin/licenselens batch --help
          /tmp/wheel-venv/bin/licenselens discover-workspace --help
          set +e
          /tmp/wheel-venv/bin/licenselens scan -o /tmp/wheel-reports
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then exit "$code"; fi
          # HTML rendered means templates + catalog were packaged via licenselens/data
          test -f /tmp/wheel-reports/security-license-lens-report.html

  report-browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser report tests
        run: pytest tests/test_report_browser.py --browser chromium --tracing=retain-on-failure -q

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
