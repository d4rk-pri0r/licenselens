name: Release

# Gated release pipeline (Todo 34 + Todo 18). Builds each artifact exactly once
# from the release tag, assembles every promoted surface, then binds final
# SHA256SUMS + trust receipts before a single promote job publishes to PyPI
# (trusted publishing / OIDC) and creates the GitHub Release.
#
# Trust posture (locked by tests/test_release_guard.py + release_receipts):
#   * tag-only trigger (build once from the release tag; forks cannot push tags),
#   * every action pinned by full commit SHA (no floating tags),
#   * least privilege: top-level `contents: read`; `id-token`/`attestations`
#     write only on the attest / sign / promote jobs that need OIDC,
#   * version consistency checked in `build` (tag == pyproject version),
#   * final SHA256SUMS computed AFTER wheel/sdist, sample bundle, signed Windows
#     ZIP, SPDX/CycloneDX SBOMs, license inventory, and release notes are all
#     assembled — promote verifies those bytes and never rebuilds,
#   * unsigned Windows artifacts cannot promote: `promote` runs
#     scripts/release/verify_signing.py and hard-fails when signing is required
#     but absent (the Windows ZIP is only ever signed via OIDC when
#     `vars.ARTIFACT_SIGNING == 'enabled'`),
#   * missing SBOM/attestation/signing receipts cannot promote.
#
# Requires two protected environments in repository settings:
#   * `signing`     — grants the Azure federated-credential OIDC + signing vars,
#   * `production`  — grants PyPI trusted publishing + GitHub Release write.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build once (wheel + sdist + inventory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.12"

      - name: Verify tag version == package version
        run: python scripts/release/verify_version.py "${{ github.ref_name }}"

      - name: Install package (scanner + build deps)
        run: |
          python -m pip install --upgrade pip build
          pip install -e .

      - name: Provenance scan (git-reachable history before build)
        run: |
          mkdir -p dist-receipts
          python scripts/provenance_scan.py --git-reachable --json \
            -o dist-receipts/provenance-git-reachable.json

      - name: Build sdist + wheel
        run: |
          python -m build

      - name: Provenance scan (built wheel/sdist members)
        run: |
          mkdir -p dist-receipts
          python scripts/provenance_scan.py --artifacts --json \
            -o dist-receipts/provenance-artifacts.json

      - name: Generate dependency/license inventory
        run: python scripts/release/license_inventory.py --output dist/license-inventory.json

      - name: Capture CI build receipt
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/release/capture_receipt.py \
            --kind ci \
            --commit-sha "${{ github.sha }}" \
            --expected-commit-sha "${{ github.sha }}" \
            --run-url "$RUN_URL" \
            --run-id "${{ github.run_id }}" \
            --conclusion success \
            --artifacts-dir dist \
            --output dist-receipts/ci.json

      - name: Upload distributions (wheel/sdist/inventory; no final checksums yet)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/license-inventory.*
          if-no-files-found: error

      - name: Upload provenance + CI receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-provenance
          path: dist-receipts/
          if-no-files-found: error

      - name: Upload report sample bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-sample
          path: examples/sample-report/
          if-no-files-found: error

  build-windows:
    name: Build Windows one-folder (unsigned)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.12"

      - name: Install build-windows deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build-windows]"

      - name: Build one-folder distribution (unsigned at this stage)
        run: pyinstaller --clean --noconfirm packaging/windows/licenselens.spec

      - name: Upload unsigned one-folder (never promoted directly)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-windows
          path: dist/licenselens/
          if-no-files-found: error

  sbom:
    name: Generate SPDX + CycloneDX SBOM
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.12"

      - name: Install package (receipt helpers)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-dist
          path: dist

      - name: Generate SPDX SBOM (from built distributions)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: dist
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Generate CycloneDX SBOM (from built distributions)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: dist
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Capture SBOM receipt
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p dist-receipts
          python scripts/release/capture_receipt.py \
            --kind sbom \
            --commit-sha "${{ github.sha }}" \
            --expected-commit-sha "${{ github.sha }}" \
            --run-url "$RUN_URL" \
            --run-id "${{ github.run_id }}" \
            --conclusion success \
            --artifact "sbom.spdx.json=$(sha256sum sbom.spdx.json | awk '{print $1}')" \
            --artifact "sbom.cyclonedx.json=$(sha256sum sbom.cyclonedx.json | awk '{print $1}')" \
            --output dist-receipts/sbom.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-sboms
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
          if-no-files-found: error

      - name: Upload SBOM receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-receipt-sbom
          path: dist-receipts/sbom.json
          if-no-files-found: error

  sign-windows:
    name: Sign Windows ZIP (Microsoft Artifact Signing, OIDC)
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    environment: signing
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Download unsigned one-folder
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-windows
          path: windows-dist/licenselens

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.12"

      - name: Install package (for deterministic re-zip helper + receipts)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Sign licenselens.exe (Microsoft Artifact Signing, OIDC)
        # Only signs when configured; otherwise the artifact stays unsigned and
        # the promote gate below will hard-fail under the required policy.
        if: ${{ vars.ARTIFACT_SIGNING == 'enabled' }}
        uses: Azure/trusted-signing-action@48da903ca5e2d362da62c631a42d77c02ec7eadb
        with:
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: windows-dist/licenselens
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package and record signing status
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature windows-dist/licenselens/licenselens.exe
          $signed = ($sig.Status -eq 'Valid')
          $version = (python -c "from licenselens import __version__; print(__version__)").Trim()
          $label = if ($signed) { '' } else { '-test-only' }
          $zipName = "licenselens-windows-x64-$version$label.zip"
          python -c "import sys; from pathlib import Path; from licenselens.windows_dist import write_deterministic_zip; write_deterministic_zip(Path('windows-dist/licenselens'), Path('windows-dist') / sys.argv[1])" "$zipName"
          $sha = (Get-FileHash -Algorithm SHA256 "windows-dist/$zipName").Hash.ToLower()
          $status = @{ signed = $signed; artifact = $zipName; sha256 = $sha; policy = 'required' } | ConvertTo-Json
          Set-Content -Path windows-dist/signing-status.json -Value $status
          "signed=$signed  artifact=$zipName  sha256=$sha"

      - name: Capture signing + windows receipts
        shell: pwsh
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          New-Item -ItemType Directory -Force -Path dist-receipts | Out-Null
          $zip = Get-ChildItem windows-dist/*.zip | Select-Object -First 1
          $sha = (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLower()
          python scripts/release/capture_receipt.py `
            --kind signing `
            --commit-sha "${{ github.sha }}" `
            --expected-commit-sha "${{ github.sha }}" `
            --run-url "$env:RUN_URL" `
            --run-id "${{ github.run_id }}" `
            --conclusion success `
            --artifact "$($zip.Name)=$sha" `
            --output dist-receipts/signing.json
          python scripts/release/capture_receipt.py `
            --kind windows `
            --commit-sha "${{ github.sha }}" `
            --expected-commit-sha "${{ github.sha }}" `
            --run-url "$env:RUN_URL" `
            --run-id "${{ github.run_id }}" `
            --conclusion success `
            --artifact "$($zip.Name)=$sha" `
            --output dist-receipts/windows.json

      - name: Upload signed-or-unsigned Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-windows-signed
          path: |
            windows-dist/*.zip
            windows-dist/signing-status.json
          if-no-files-found: error

      - name: Upload signing receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-receipt-signing
          path: dist-receipts/
          if-no-files-found: error

  checksums:
    name: Assemble bundle + final SHA256SUMS (all promoted artifacts)
    needs: [build, build-windows, sbom, sign-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.12"

      - name: Install package (assemble + receipt helpers)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-dist
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-windows-signed
          path: release-assets

      - name: Download SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-sboms
          path: sboms

      - name: Download report sample
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-sample
          path: sample

      - name: Generate release notes (pre-checksum, no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# Security License Lens ${{ github.ref_name }}"
            echo
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="${{ github.ref_name }}" \
              -f target_commitish="${{ github.sha }}" \
              --jq .body
          } > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Assemble final bundle + SHA256SUMS + release receipt
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/release/assemble_bundle.py \
            --out release-bundle \
            --dist dist \
            --windows release-assets \
            --sbom sboms \
            --sample sample \
            --notes RELEASE_NOTES.md \
            --receipts-out dist-receipts \
            --commit-sha "${{ github.sha }}" \
            --run-url "$RUN_URL" \
            --run-id "${{ github.run_id }}" \
            --conclusion success

      - name: Recompute and compare final SHA-256 (no rebuild)
        run: |
          cd release-bundle
          sha256sum -c SHA256SUMS

      - name: Upload final release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-bundle
          path: release-bundle/
          if-no-files-found: error

      - name: Upload release receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-receipt-release
          path: dist-receipts/
          if-no-files-found: error

  attest:
    name: Attest provenance and SBOM
    needs: [checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.12"

      - name: Install package (receipt helpers)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download final release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-bundle
          path: release-bundle

      - name: Verify final SHA256SUMS before attestation (no rebuild)
        run: |
          cd release-bundle
          sha256sum -c SHA256SUMS

      - name: Attest build provenance (bind exact assembled bytes)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            release-bundle/*.whl
            release-bundle/*.tar.gz
            release-bundle/*.zip

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-path: |
            release-bundle/*.whl
            release-bundle/*.tar.gz
            release-bundle/*.zip
          sbom-path: |
            release-bundle/sbom.spdx.json
            release-bundle/sbom.cyclonedx.json

      - name: Capture attestation receipt
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p dist-receipts
          python scripts/release/capture_receipt.py \
            --kind attestation \
            --commit-sha "${{ github.sha }}" \
            --expected-commit-sha "${{ github.sha }}" \
            --run-url "$RUN_URL" \
            --run-id "${{ github.run_id }}" \
            --conclusion success \
            --artifacts-dir release-bundle \
            --output dist-receipts/attestation.json

      - name: Upload attestation receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-receipt-attestation
          path: dist-receipts/attestation.json
          if-no-files-found: error

  promote:
    name: Promote to production release
    needs: [build, build-windows, checksums, sbom, attest, sign-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.12"

      - name: Install package (receipt validators)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download final release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-bundle
          path: release-bundle

      - name: Download provenance receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-provenance
          path: provenance-receipts

      - name: Download trust receipts (sbom / signing / release / attestation)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-receipt-*
          path: trust-receipts
          merge-multiple: true

      - name: Enforce clean provenance receipts (promotion gate)
        run: |
          python scripts/release_gate.py --validate-receipts provenance-receipts \
            --require-modes git-reachable,artifacts

      - name: Re-scan release artifacts before promote
        run: |
          python scripts/provenance_scan.py --artifacts --json \
            -o provenance-receipts/provenance-artifacts-promote.json

      - name: Verify final SHA256SUMS (no rebuild)
        run: |
          cd release-bundle
          sha256sum -c SHA256SUMS

      - name: Enforce signing policy (unsigned cannot promote)
        run: python scripts/release/verify_signing.py --policy required --assets release-bundle

      - name: Enforce attestation + trust receipts (missing cannot promote)
        run: |
          python scripts/release/verify_attestation.py \
            --bundle release-bundle \
            --receipts trust-receipts \
            --expected-commit-sha "${{ github.sha }}" \
            --require-kinds sbom,attestation,signing,release,ci,windows

      - name: Validate trust receipt schema
        run: |
          python scripts/release/validate_receipts.py trust-receipts \
            --expected-commit-sha "${{ github.sha }}" \
            --require-kinds ci,windows,signing,sbom,attestation,release \
            --require-success

      - name: Stage PyPI packages from assembled bundle
        run: |
          mkdir -p dist
          cp release-bundle/*.whl release-bundle/*.tar.gz dist/

      - name: Publish to PyPI (trusted publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          body_path: release-bundle/RELEASE_NOTES.md
          files: |
            release-bundle/*
            provenance-receipts/*
            trust-receipts/*
