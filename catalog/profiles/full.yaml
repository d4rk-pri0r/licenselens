backend_preferences:
  preferred:
    - graph
    - arm
    - exchange_online
    - defender
    - secure_score
    - manual
  allow_proxy: true
  allow_manual: true
sensitive_users:
  - breakglass@example.com
sensitive_domains:
  - example.com
allowed_forwarding_domains: []
dmarc_agency_contact: reports@example.com
dmarc_federal_contact: ""
exclusions:
  - id: exclude-lab-tenant
    check_id: mdo-p2-policies-default
    owner: security@example.com
    reason: Lab tenant does not route production mail.
    expires_on: "2099-12-31"
custom_rules:
  - id: full-gap-count
    title: Full profile gap count threshold
    selector: finding.status
    operator: gte
    value: 1
    collection: count
