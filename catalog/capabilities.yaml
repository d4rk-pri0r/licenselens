  - id: defender_identity
    name: Microsoft Defender for Identity
    plain_name: Watchdogs on your on-site directory (if you still have one)
    description: On-premises identity threat detection (sensors on DCs / AD FS).
    outcome: >
      Spot attackers moving through traditional office servers and Active Directory,
      not only cloud sign-ins.
    why_it_matters: >
      Many organizations still rely on on-site domain controllers. Cloud-only
      tools cannot see every attack path there.
    if_unused: >
      Identity threat sensors may be missing or unhealthy, so on-site directory attacks stay invisible.
    workloads: [defender, identity]
    entitlement_kind: included
    service_plan_names:
