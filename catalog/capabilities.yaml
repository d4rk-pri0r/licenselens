# Capability catalog — maps Microsoft service plans / SKUs to high-value features.
# plain_name / outcome / why_it_matters / if_unused are customer-facing (SMB-friendly).
# Community PRs welcome. Prefer service_plan_names (stable) over sku_part_numbers.

version: 1
capabilities:
  - id: entra_id_p2
    name: Microsoft Entra ID P2
    plain_name: Stronger control over admin accounts
    description: PIM, Identity Protection, access reviews, and related P2 identity features.
    outcome: >
      Give people powerful admin rights only when they need them, and get better
      tools to catch risky sign-ins on high-value accounts.
    why_it_matters: >
      Admin accounts are the keys to your email, files, and business apps.
      If one is stolen, an attacker can look like a trusted employee.
    if_unused: >
      You are paying for stronger admin protections that are not fully turned on yet.
    workloads: [identity]
    service_plan_names:
      - AAD_PREMIUM_P2
    sku_part_numbers:
      - AAD_PREMIUM_P2
      - SPE_E5
      - ENTERPRISEPREMIUM
      - EMSPREMIUM
    docs_url: https://learn.microsoft.com/entra/id-governance/privileged-identity-management/pim-configure

  - id: conditional_access
    name: Conditional Access
    plain_name: Smarter sign-in rules
    description: Entra Conditional Access policy engine (included with P1/P2 and many suites).
    outcome: >
      Decide who can sign in, from where, on which devices, and whether they must
      prove it is really them (for example with multi-factor authentication).
    why_it_matters: >
      Passwords alone are not enough. Good sign-in rules stop many everyday
      account takeovers before damage is done.
    if_unused: >
      Your licenses include advanced sign-in rules, but they may still be loose or incomplete.
    workloads: [identity]
    service_plan_names:
      - AAD_PREMIUM
      - AAD_PREMIUM_P2
    sku_part_numbers:
      - AAD_PREMIUM
      - AAD_PREMIUM_P2
      - SPE_E3
      - SPE_E5
      - ENTERPRISEPREMIUM
    docs_url: https://learn.microsoft.com/entra/identity/conditional-access/overview

  - id: identity_protection
    name: Microsoft Entra ID Protection
    plain_name: Alerts when a sign-in looks suspicious
    description: User and sign-in risk detection and risk-based Conditional Access.
    outcome: >
      Automatically spot odd sign-in behavior (impossible travel, leaked passwords,
      unfamiliar locations) and require extra proof or block access.
    why_it_matters: >
      Attackers often use valid passwords. Risk detection helps catch the session
      even when the password was correct.
    if_unused: >
      Suspicious-sign-in protection is included in your plan but may not be enforcing anything yet.
    workloads: [identity]
    service_plan_names:
      - AAD_PREMIUM_P2
    sku_part_numbers:
      - AAD_PREMIUM_P2
      - SPE_E5
      - ENTERPRISEPREMIUM
    docs_url: https://learn.microsoft.com/entra/id-protection/overview-identity-protection

  - id: defender_office_p2
    name: Microsoft Defender for Office 365 P2
    plain_name: Stronger email and file threat protection
    description: Safe Attachments, Safe Links, threat investigation, automated response.
    outcome: >
      Open risky attachments and links in a safe way, catch advanced phishing,
      and investigate email threats faster when something slips through.
    why_it_matters: >
      Most business breaches still start with email. Better email protection
      reduces ransomware and invoice fraud.
    if_unused: >
      Extra email protections in your license may still be off, in test mode, or only covering a few people.
    workloads: [defender]
    service_plan_names:
      - THREAT_INTELLIGENCE
      - ATP_ENTERPRISE
    sku_part_numbers:
      - SPE_E5
      - ENTERPRISEPREMIUM
      - IDENTITY_THREAT_PROTECTION
    docs_url: https://learn.microsoft.com/defender-office-365/preset-security-policies

  - id: defender_endpoint_p2
    name: Microsoft Defender for Endpoint P2
    plain_name: Deep protection and visibility on PCs and devices
    description: Endpoint detection and response, threat and vulnerability management.
    outcome: >
      See attacks on laptops and servers in more detail, find weak software,
      and respond before a single infected PC becomes a company-wide problem.
    why_it_matters: >
      Devices are where people work. If they are not enrolled in advanced protection,
      you are flying partly blind.
    if_unused: >
      You may be paying for advanced device protection on seats that are not fully enrolled.
    workloads: [defender, endpoint]
    service_plan_names:
      - DEFENDER_ENDPOINT_P2
      - MDATP_XPLAT
    sku_part_numbers:
      - SPE_E5
      - IDENTITY_THREAT_PROTECTION
      - DEFENDER_ENDPOINT_P2
    docs_url: https://learn.microsoft.com/defender-endpoint/onboarding

  - id: defender_identity
    name: Microsoft Defender for Identity
    plain_name: Watchdogs on your on-site directory (if you still have one)
    description: On-premises identity threat detection (sensors on DCs / AD FS).
    outcome: >
      Spot attackers moving through traditional office servers and Active Directory,
      not only cloud sign-ins.
    why_it_matters: >
      Many organizations still rely on on-site domain controllers. Cloud-only
      tools cannot see every attack path there.
    if_unused: >
      Identity threat sensors may be missing or unhealthy, so on-site directory attacks stay invisible.
    workloads: [defender, identity]
    service_plan_names:
      - ATA
      - MDI_Service_Plan
    sku_part_numbers:
      - SPE_E5
      - EMSPREMIUM
      - ENTERPRISEPREMIUM
    docs_url: https://learn.microsoft.com/defender-for-identity/deploy-defender-identity

  - id: microsoft_sentinel
    name: Microsoft Sentinel
    plain_name: A central security command center in the cloud
    description: Cloud-native SIEM/SOAR analytics workspace capabilities.
    outcome: >
      Bring security signals together in one place, detect patterns humans miss,
      and automate parts of incident response.
    why_it_matters: >
      Without a place that correlates events, teams drown in alerts from many products
      and miss the story that ties them together.
    if_unused: >
      A security workspace may exist, but few detections or smart analytics are turned on.
    workloads: [sentinel]
    service_plan_names:
      - MICROSOFT_SENTINEL
    sku_part_numbers:
      - MICROSOFT_SENTINEL
      - AZURE_SENTINEL
    docs_url: https://learn.microsoft.com/azure/sentinel/overview

  - id: purview_dlp
    name: Microsoft Purview Data Loss Prevention
    plain_name: Guardrails so sensitive data is harder to leak
    description: Endpoint and workload DLP policy enforcement.
    outcome: >
      Warn or block people when they try to share credit cards, health data,
      or other sensitive information in the wrong place.
    why_it_matters: >
      Accidental oversharing is common. Guardrails protect customers and reduce
      regulatory and reputational harm.
    if_unused: >
      Data-protection rules may be missing or still in "test only" mode, so nothing is enforced yet.
    workloads: [purview]
    service_plan_names:
      - MIP_S_CLP2
      - INFORMATION_BARRIERS
    sku_part_numbers:
      - SPE_E5
      - ENTERPRISEPREMIUM
      - INFORMATION_PROTECTION_COMPLIANCE
    docs_url: https://learn.microsoft.com/purview/dlp-learn-about-dlp
