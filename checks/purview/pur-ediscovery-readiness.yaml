id: pur-ediscovery-readiness
title: eDiscovery readiness
customer_title: Confirm eDiscovery is set up
customer_summary: >
  eDiscovery cases and legal holds preserve evidence when it matters. Premium
  eDiscovery cases are read directly, so their existence is checked automatically.
expected_state: Premium eDiscovery cases exist and legal hold workflows are in use.
customer_next_step: >
  Create a test Premium case with a legal hold, and confirm eDiscovery
  administrators are assigned in the Purview portal.
description: >
  Premium eDiscovery cases are read directly from Microsoft Graph
  (security/cases/ediscoveryCases). An empty case list is reported honestly as
  unverified (no cases, or the scanning identity lacks case visibility).
workload: purview
required_capabilities:
  - purview_ediscovery
severity: medium
value_impact: high
impact: high
effort: days
blast_radius: all_users
pack: starter
exposure_class: none
deep_link: https://purview.microsoft.com/ediscovery
collector: graph_purview_ediscovery
remediation: >
  Verify eDiscovery administrator roles are assigned and that case and legal
  hold workflows are configured and tested.
references:
  - https://learn.microsoft.com/purview/ediscovery
  - https://learn.microsoft.com/graph/api/security-casesroot-list-ediscoverycases
enabled: true
