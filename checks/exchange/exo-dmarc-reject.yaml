id: exo-dmarc-reject
title: DMARC policy is weaker than reject
customer_title: Set DMARC policy to reject
customer_summary: >
  Weaker DMARC policies still let spoofed mail reach inboxes.
expected_state: Every domain's DMARC policy is set to reject.
customer_next_step: >
  Set p=reject on every domain DMARC record.
description: >
  DMARC policy is weaker than reject.
workload: exchange
required_capabilities:
  - exchange_online
severity: high
value_impact: high
impact: high
effort: hours
blast_radius: all_users
pack: email
exposure_class: none
deep_link: https://admin.microsoft.com/#/Domains
collector: exchange_collector
remediation: >
  Set p=reject on every domain DMARC record.
references:
  - https://learn.microsoft.com/microsoft-365/security/office-365-security/email-authentication-dmarc-configure
flagship: true
flagship_security_intent: "Set every domain's DMARC policy to reject so spoofed mail cannot reach inboxes."
enabled: true
tier: hygiene
pass_criteria:
  ok: Every checked domain publishes a DMARC policy of reject.
  partial: Some domains publish a weaker DMARC policy.
  gap: Domains are missing a DMARC reject policy.
  evidence_fields:
    - dmarc_not_reject
    - domains_checked
