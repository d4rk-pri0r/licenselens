id: sen-analytics-rule-coverage
title: Sentinel workspace with thin analytics rule coverage
customer_title: Your security command center may have few alarms turned on
customer_summary: >
  A central security workspace only helps if detection rules are enabled.
  An empty or near-default setup means you pay for the building but leave
  most of the alarm system off.
expected_state: Sentinel runs enabled scheduled rules covering identity, endpoint, and cloud sources.
customer_next_step: >
  Enable a starter set of detection rules for sign-ins, email, and devices,
  then expand coverage with your IT or security partner.
description: >
  A Sentinel workspace with few enabled scheduled analytics rules leaves
  SIEM spend without detection yield.
workload: sentinel
required_capabilities:
  - microsoft_sentinel
severity: high
value_impact: high
impact: high
effort: hours
blast_radius: all_users
pack: starter
exposure_class: none
deep_link: https://learn.microsoft.com/azure/sentinel/detect-threats-built-in
collector: sentinel_analytics
remediation: >
  Enable relevant content hub solutions and scheduled rules; cover
  identity, endpoint, and cloud control-plane sources first.
references:
  - https://learn.microsoft.com/azure/sentinel/detect-threats-built-in
enabled: true
