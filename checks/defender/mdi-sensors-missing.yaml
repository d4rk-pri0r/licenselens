id: mdi-sensors-missing
title: Defender for Identity licensed but sensors missing or unhealthy
description: >
  MDI requires sensors on domain controllers (and often AD FS). Licensing
  without healthy sensor coverage leaves identity threat detection dark.
workload: defender
required_capabilities:
  - defender_identity
severity: medium
value_impact: high
collector: mdi_sensors
remediation: >
  Deploy and health-check MDI sensors on all DCs; fix connectivity and
  directory service account configuration issues.
references:
  - https://learn.microsoft.com/defender-for-identity/deploy-defender-identity
enabled: true
