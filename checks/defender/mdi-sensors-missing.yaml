id: mdi-sensors-missing
title: Defender for Identity licensed but sensors missing or unhealthy
customer_title: On-site directory servers may lack attack sensors
customer_summary: >
  If you still run traditional office directory servers, special sensors
  watch for attackers moving through them. Without healthy sensors, that
  part of your environment can stay invisible.
customer_next_step: >
  Confirm whether you still use on-site directory servers; if yes, install
  and health-check the identity sensors on each one.
description: >
  MDI requires sensors on domain controllers (and often AD FS). Licensing
  without healthy sensor coverage leaves identity threat detection dark.
workload: defender
required_capabilities:
  - defender_identity
severity: medium
value_impact: high
impact: high
effort: days
blast_radius: all_users
pack: starter
exposure_class: none
deep_link: https://security.microsoft.com/health
collector: mdi_sensors
remediation: >
  Deploy and health-check MDI sensors on all DCs; fix connectivity and
  directory service account configuration issues.
references:
  - https://learn.microsoft.com/defender-for-identity/deploy-defender-identity
enabled: true
