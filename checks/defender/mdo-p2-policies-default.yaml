id: mdo-p2-policies-default
title: Defender for Office 365 P2 policies not broadly enforced
customer_title: Extra email protections may not cover everyone yet
customer_summary: >
  Your license can open suspicious attachments and links safely and stop
  many phishing attacks. If those features are off, in test mode, or only
  applied to a pilot group, most people still lack the stronger shield.
customer_next_step: >
  Turn on the recommended email security policies for all users
  (not just a test group), starting with safe links and safe attachments.
description: >
  Safe Attachments / Safe Links and related P2 protections often remain
  off, audit-only, or scoped to pilots despite E5/MDO P2 licensing.
workload: defender
required_capabilities:
  - defender_office_p2
severity: high
value_impact: high
collector: graph_mdo
remediation: >
  Enforce Safe Attachments and Safe Links for all recipients; enable
  preset security policies or equivalent custom policies in block mode.
references:
  - https://learn.microsoft.com/defender-office-365/preset-security-policies
enabled: true
