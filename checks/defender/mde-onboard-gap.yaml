id: mde-onboard-gap
title: Defender for Endpoint licensed seats vs onboarded devices gap
customer_title: Some PCs may not be enrolled in advanced device protection
customer_summary: >
  Paying for advanced device security only helps machines that are actually
  enrolled and healthy. A large gap means laptops or servers may be missing
  the deeper monitoring you already fund.
expected_state: Licensed devices are onboarded to Defender for Endpoint with healthy sensors.
customer_next_step: >
  Compare licensed seats to enrolled devices and enroll the missing ones
  (often through your device management tools).
description: >
  Large gaps between MDE P2 licensing and onboarded devices mean EDR
  coverage (and license value) is not realized.
workload: endpoint
required_capabilities:
  - defender_endpoint_p2
  - defender_endpoint_p1
severity: high
value_impact: high
impact: high
effort: days
blast_radius: devices
pack: endpoint
exposure_class: none
deep_link: https://security.microsoft.com/machines
collector: mde_onboarding
remediation: >
  Onboard missing devices via Intune, GPO, or scripts; investigate
  unhealthy sensors; align license assignment with actual endpoints.
references:
  - https://learn.microsoft.com/defender-endpoint/onboarding
flagship: true
flagship_security_intent: "Onboard licensed devices to Defender for Endpoint so EDR coverage and license value are realized."
enabled: true
pass_criteria:
  ok: Onboarded machines meet the active-device denominator (or the licensed-seat signal when no inventory join is available).
  partial: Onboarding is below the threshold, or only a licensed-seat leverage signal is available.
  gap: Almost none of the expected devices are onboarded when an authoritative denominator exists.
  evidence_fields:
    - onboarded_machines
    - licensed_units
    - coverage_ratio
    - truncated
