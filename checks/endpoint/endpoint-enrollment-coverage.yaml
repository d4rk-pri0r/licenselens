id: endpoint-enrollment-coverage
title: Intune licensed seats vs enrolled devices gap
customer_title: Some paid device-management seats may not be enrolled
customer_summary: >
  Paying for device management only protects devices that are actually
  enrolled. A large gap means laptops and phones may be bypassing the cloud
  identity and compliance controls you already fund.
expected_state: Licensed devices are enrolled in Intune management.
customer_next_step: >
  Compare Intune licenses to enrolled devices and enroll the missing ones
  through the device management tools you already use.
description: >
  Large gaps between Intune licensing and managed-device enrollment mean
  device-management value (and unmanaged-device protection) is not realized.
workload: endpoint
required_capabilities:
  - intune
severity: high
value_impact: high
impact: high
effort: days
blast_radius: devices
pack: endpoint
exposure_class: none
deep_link: https://endpoint.microsoft.com/#view/Microsoft_Intune_Devices/DevicesMenu/~/allDevices
collector: intune_collector
remediation: >
  Enroll missing devices into Intune (Windows, iOS, Android, macOS); align
  license assignment with actual endpoints; investigate unmanaged devices.
references:
  - https://learn.microsoft.com/mem/intune/fundamentals/deployment-guide-enroll
enabled: true
