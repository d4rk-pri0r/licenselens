id: id-idprotect-off
title: Identity Protection policies off or report-only
customer_title: Risk-based sign-in protection
customer_summary: >
  Your plan can flag odd sign-in behavior (like a login from an unusual country
  right after one at the office). If those protections are off or "report only,"
  risky logins may still succeed.
customer_next_step: >
  Turn on risk-based sign-in protection in stages — start by requiring extra
  verification when Microsoft marks a sign-in as risky.
description: >
  Entra ID P2 includes Identity Protection. Risk policies left disabled or
  report-only leave paid risk detections unenforced.
workload: identity
required_capabilities:
  - identity_protection
severity: high
value_impact: high
impact: high
effort: hours
blast_radius: all_users
pack: identity
exposure_class: none
deep_link: https://entra.microsoft.com/#view/Microsoft_AAD_ConditionalAccess/ConditionalAccessBlade/~/Policies
collector: graph_identity_protection
remediation: >
  Enable user-risk and sign-in-risk policies in staged rollout, then enforce
  for privileged and high-value users.
references:
  - https://learn.microsoft.com/entra/id-protection/overview-identity-protection
enabled: true
