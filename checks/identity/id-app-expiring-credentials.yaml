id: id-app-expiring-credentials
title: Application credentials expired or expiring soon
customer_title: Rotate expiring app secrets and certificates
customer_summary: >
  Expired or soon-to-expire app credentials cause outages and encourage emergency long-lived replacements.
customer_next_step: >
  Rotate credentials expiring within 30 days and remove already-expired secrets.
description: >
  Application secrets and certificates should not be expired or within 30 days of expiry without rotation.
workload: identity
required_capabilities:
  - conditional_access
severity: medium
value_impact: medium
impact: medium
effort: hours
blast_radius: admin
pack: identity
exposure_class: none
deep_link: https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade
collector: graph_applications
remediation: >
  Rotate expiring credentials and monitor end dates for all app registrations.
references:
  - https://learn.microsoft.com/entra/identity-platform/certificate-credentials
enabled: true
