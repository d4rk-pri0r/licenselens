id: id-ca-high-risk-signins
title: High-risk sign-ins not blocked by Conditional Access
customer_title: Block suspicious high-risk sign-ins
customer_summary: >
  Odd sign-ins can be stopped automatically when Microsoft marks them high risk. Without enforcement, those logins may still succeed.
expected_state: Sign-ins marked high risk by Identity Protection are blocked.
customer_next_step: >
  Enforce a Conditional Access policy that blocks high sign-in risk.
description: >
  Identity Protection high sign-in risk should be blocked through Conditional Access.
workload: identity
required_capabilities:
  - identity_protection
severity: high
value_impact: high
impact: high
effort: hours
blast_radius: all_users
pack: identity
exposure_class: none
deep_link: https://entra.microsoft.com/#view/Microsoft_AAD_ConditionalAccess/ConditionalAccessBlade/~/Policies
collector: graph_identity_protection
remediation: >
  Create an enforced Conditional Access policy blocking sign-in risk level High for all users.
references:
  - https://learn.microsoft.com/entra/id-protection/howto-identity-protection-configure-risk-policies
mappings:
  nist: ["AC-2", "IA-2"]
  mitre: ["T1078"]
flagship: true
flagship_security_intent: "Block sign-ins marked high risk by Identity Protection via Conditional Access."
enabled: true
tier: activation
pass_criteria:
  ok: Sign-ins marked high risk are blocked for all users on all cloud apps.
  partial: A high-risk sign-in block exists but is limited in who or what it covers.
  gap: High-risk sign-ins are not blocked.
  evidence_fields:
    - enforced_policies
    - universal_policies
    - scoped_policies
    - scope_gaps_best
    - security_defaults_enabled
    - unjustified_exclusion_issues
    - protected_population
