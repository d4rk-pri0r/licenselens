id: id-app-password-addition-blocked
title: Application password addition not blocked
customer_title: Block legacy app passwords
customer_summary: >
  App passwords let older clients skip modern multi-factor prompts and should be blocked when possible.
expected_state: App passwords that bypass MFA are blocked for all users.
customer_next_step: >
  Block creation of app passwords with Conditional Access or authentication method controls.
description: >
  Users should not be able to create application passwords that bypass MFA.
workload: identity
required_capabilities:
  - conditional_access
severity: medium
value_impact: medium
impact: medium
effort: hours
blast_radius: all_users
pack: identity
exposure_class: none
deep_link: https://entra.microsoft.com/#view/Microsoft_AAD_ConditionalAccess/ConditionalAccessBlade/~/Policies
collector: graph_ca
remediation: >
  Block app password creation via Conditional Access or disable legacy per-app passwords.
references:
  - https://learn.microsoft.com/entra/identity/authentication/howto-mfa-app-passwords
enabled: true
