id: id-protective-plan-assignment
title: Protective plans are not assigned to most enabled users
customer_title: Protective plans are assigned to only some users
customer_summary: >-
  A plan can be in the tenant without being assigned to people. This check
  counts how many enabled member users have each protective plan assigned.
expected_state: Protective plans are assigned to at least 85% of enabled member users.
customer_next_step: >-
  Assign Entra ID P2, Identity Protection, Defender for Office, Defender for
  Endpoint, and Purview DLP to the users who should receive those protections.
description: >-
  Tenant-level entitlement is not the same as per-user assignment. Count
  assignedPlans for owned protective capabilities against enabled member users.
workload: identity
required_capabilities:
  - entra_id_p2
  - identity_protection
  - defender_office_p2
  - defender_endpoint_p2
  - purview_dlp
severity: high
value_impact: high
impact: high
effort: hours
blast_radius: all_users
pack: identity
exposure_class: none
deep_link: https://entra.microsoft.com/#view/Microsoft_AAD_IAM/LicensesMenuBlade/~/Products
collector: license_assignment_collector
remediation: >-
  In Entra ID > Licenses, assign the protective plans to the users who should
  receive them. This check reports assignment counts, not license cost.
references:
  - https://learn.microsoft.com/entra/identity/users/licensing-groups-assign
mappings:
  nist: ["CM-8"]
  mitre: ["T1078"]
flagship: false
flagship_security_intent: ""
enabled: true
