id: id-security-defaults-on
title: Security defaults enabled instead of Conditional Access
customer_title: Move from Security Defaults to customizable sign-in rules
customer_summary: >
  Security Defaults is active, so baseline multi-factor authentication and
  legacy-authentication blocking are in place. Your plan also includes
  Conditional Access for tailoring these protections, but that paid
  customization remains unused.
customer_next_step: >
  Create equivalent Conditional Access policies for MFA and legacy-authentication
  blocking in report-only mode. Validate coverage, exclusions, emergency access,
  and sign-in impact; then perform a controlled cutover from Security Defaults
  to the validated policies.
description: >
  Security Defaults provides baseline MFA protections and blocks legacy
  authentication. When the tenant is licensed for Conditional Access (Entra
  ID P1 or P2) but still has Security Defaults enabled, paid policy
  customization is not being used.
workload: identity
required_capabilities:
  - conditional_access
severity: high
value_impact: high
impact: high
effort: hours
blast_radius: all_users
pack: identity
exposure_class: none
deep_link: https://entra.microsoft.com/#view/Microsoft_AAD_IAM/ConditionalAccessBlade
collector: graph_security_defaults
remediation: >
  Create equivalent Conditional Access policies for MFA and legacy-authentication
  blocking in report-only mode, with appropriate emergency-access exclusions.
  Validate their coverage and sign-in impact. Only then disable Security Defaults
  and immediately enable the validated policies in a controlled cutover.
references:
  - https://learn.microsoft.com/en-us/entra/fundamentals/security-defaults
  - https://learn.microsoft.com/entra/identity/conditional-access/overview
enabled: true
