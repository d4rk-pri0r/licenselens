id: id-security-defaults-on
title: Security defaults enabled instead of Conditional Access
customer_title: Switch from basic security defaults to smarter sign-in rules
customer_summary: >
  Your plan includes advanced sign-in rules (Conditional Access) that can
  enforce multi-factor authentication for admins, block outdated sign-in
  methods, and react to risky behavior. Right now those capabilities appear
  unused — the tenant is still relying on the free baseline "security
  defaults" that never prompts for MFA in high-value scenarios.
customer_next_step: >
  Review and disable security defaults, then turn on Conditional Access
  policies that require MFA for all users and admins (start with a
  report-only pilot if you prefer).
description: >
  Security defaults is a free, one-size-fits-all baseline. When the tenant
  is licensed for Conditional Access (Entra ID P1 or P2) but still has
  security defaults enabled, the full identity protection stack is not being
  used.
workload: identity
required_capabilities:
  - conditional_access
severity: high
value_impact: high
impact: high
effort: hours
blast_radius: all_users
pack: identity
exposure_class: none
deep_link: https://entra.microsoft.com/#view/Microsoft_AAD_IAM/ConditionalAccessBlade
collector: graph_security_defaults
remediation: >
  Disable security defaults in Entra ID → Properties → Manage security
  defaults. Create Conditional Access policies requiring MFA for all users,
  blocking legacy authentication, and optionally reacting to sign-in risk.
references:
  - https://learn.microsoft.com/entra/fundamentals/security-defaults
  - https://learn.microsoft.com/entra/identity/conditional-access/overview
enabled: true
