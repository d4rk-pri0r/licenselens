id: id-auth-weak-methods-disabled
title: Weak authentication methods still enabled
customer_title: Turn off SMS, voice, and email one-time codes
customer_summary: >
  Text messages, phone calls, and email codes are the easiest multi-factor methods for attackers to intercept or social-engineer.
customer_next_step: >
  Disable SMS, Voice, and Email OTP authentication methods.
description: >
  Weak authentication methods SMS, Voice, and Email OTP should be disabled.
workload: identity
required_capabilities:
  - conditional_access
severity: high
value_impact: high
impact: high
effort: hours
blast_radius: all_users
pack: identity
exposure_class: none
deep_link: https://entra.microsoft.com/#view/Microsoft_AAD_IAM/AuthenticationMethodsMenuBlade
collector: graph_auth_methods
remediation: >
  Disable SMS, Voice call, and Email OTP in Authentication methods policies.
references:
  - https://learn.microsoft.com/entra/identity/authentication/concept-authentication-methods
enabled: true
