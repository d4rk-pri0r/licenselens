id: id-pim-unused
title: PIM licensed but privileged access not operationalized
customer_title: Admin accounts still have "always on" superpowers
customer_summary: >
  Your plan includes tools to give admins access only when they need it.
  If those tools are unused, high-power accounts stay permanently powerful —
  which is riskier if a password is stolen.
customer_next_step: >
  Ask IT to turn on time-limited admin access for your top admins first
  (Global Administrator and similar roles).
description: >
  Entra ID P2 enables Privileged Identity Management. Standing permanent
  privileged roles with little or no eligible/activated PIM usage indicates
  paid capability left unused.
workload: identity
required_capabilities:
  - entra_id_p2
severity: high
value_impact: high
impact: high
effort: days
blast_radius: admin
pack: identity
exposure_class: none
deep_link: https://portal.azure.com/#view/Microsoft_AAD_IAM/RoleAssignmentsBlade
collector: graph_pim
remediation: >
  Convert standing admin roles to PIM-eligible where possible, require
  activation with MFA/justification, and review permanent role assignments.
references:
  - https://learn.microsoft.com/entra/id-governance/privileged-identity-management/pim-configure
enabled: true
