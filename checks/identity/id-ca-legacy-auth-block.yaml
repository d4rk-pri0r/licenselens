id: id-ca-legacy-auth-block
title: Legacy authentication not blocked by Conditional Access
customer_title: Block outdated sign-in methods
customer_summary: >
  Older email and client sign-in methods skip modern multi-factor checks. If they are still allowed, stolen passwords are easier to abuse.
expected_state: Legacy authentication clients are blocked tenant-wide.
customer_next_step: >
  Create a Conditional Access policy that blocks legacy authentication for all users, with documented emergency-access exclusions only.
description: >
  Tenants licensed for Conditional Access should enforce a block on legacy authentication clients.
workload: identity
required_capabilities:
  - conditional_access
severity: high
value_impact: high
impact: high
effort: hours
blast_radius: all_users
pack: identity
exposure_class: none
deep_link: https://entra.microsoft.com/#view/Microsoft_AAD_ConditionalAccess/ConditionalAccessBlade/~/Policies
collector: graph_ca
remediation: >
  Enable an all-user Conditional Access policy that blocks Exchange ActiveSync and other legacy clients.
references:
  - https://learn.microsoft.com/entra/identity/conditional-access/block-legacy-authentication
enabled: true
