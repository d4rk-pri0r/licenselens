id: id-ca-mfa-all-users
title: MFA not enforced for all users via Conditional Access
customer_title: Require multi-factor authentication for everyone
customer_summary: >
  Your plan can require a second factor for every sign-in. Without that rule, password-only access remains possible for many accounts.
customer_next_step: >
  Enforce a Conditional Access policy requiring multi-factor authentication for all users.
description: >
  Conditional Access should require MFA for all users, not only admins.
workload: identity
required_capabilities:
  - conditional_access
severity: high
value_impact: high
impact: high
effort: hours
blast_radius: all_users
pack: identity
exposure_class: none
deep_link: https://entra.microsoft.com/#view/Microsoft_AAD_ConditionalAccess/ConditionalAccessBlade/~/Policies
collector: graph_ca
remediation: >
  Create and enforce an all-user MFA Conditional Access policy; document break-glass exclusions in the assessment profile.
references:
  - https://learn.microsoft.com/entra/identity/conditional-access/howto-conditional-access-policy-all-users-mfa
enabled: true
