id: id-ca-phishing-resistant-privileged
title: Phishing-resistant MFA not enforced for privileged roles
customer_title: Require strong sign-in for powerful admin roles
customer_summary: >
  Admin accounts are the highest-value targets. They should require phishing-resistant methods even if the rest of the tenant is still catching up.
expected_state: Privileged directory roles sign in with phishing-resistant MFA via Conditional Access.
customer_next_step: >
  Enforce phishing-resistant MFA for Global Administrator and other highly privileged roles.
description: >
  Highly privileged directory roles should require phishing-resistant MFA via Conditional Access.
workload: identity
required_capabilities:
  - conditional_access
severity: critical
value_impact: high
impact: high
effort: hours
blast_radius: admin
pack: identity
exposure_class: none
deep_link: https://entra.microsoft.com/#view/Microsoft_AAD_ConditionalAccess/ConditionalAccessBlade/~/Policies
collector: graph_ca
remediation: >
  Target highly privileged directory roles with an enforced phishing-resistant MFA Conditional Access policy.
references:
  - https://learn.microsoft.com/entra/identity/role-based-access-control/privileged-roles-permissions
mappings:
  nist: ["IA-2", "IA-5"]
  mitre: ["T1078"]
flagship: true
flagship_security_intent: "Require phishing-resistant MFA for highly privileged directory roles via Conditional Access."
enabled: true
pass_criteria:
  ok: Privileged directory roles must use phishing-resistant MFA on all cloud apps.
  partial: Privileged MFA exists but is limited to some apps or some roles.
  gap: Privileged roles are not required to use phishing-resistant MFA.
  evidence_fields:
    - enforced_policies
    - universal_policies
    - scoped_policies
    - scope_gaps_best
    - security_defaults_enabled
    - unjustified_exclusion_issues
