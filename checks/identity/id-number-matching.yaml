id: id-number-matching
title: Authenticator number matching is not enforced
customer_title: Make approvals require typing the on-screen number
customer_summary: >
  Attackers trick people into approving fake sign-in prompts while they are
  not looking. Requiring people to type the number shown on the sign-in
  screen stops this 'MFA fatigue' attack almost entirely, and we could not
  confirm that requirement is active in your tenant.
expected_state: Microsoft Authenticator requires users to type the number shown on screen when approving sign-ins.
customer_next_step: >
  In Authentication methods settings, set Microsoft Authenticator number
  matching to Enabled and confirm the policy applies to all users.
description: >
  Number matching makes a Microsoft Authenticator push require the user to
  enter the two-digit number displayed at sign-in, which defeats push-bombing
  and MFA-fatigue attacks. Microsoft has made number matching mandatory for
  Authenticator MFA since May 2023, so an explicitly disabled state signals
  a regression; this check verifies the tenant's configured state directly.
workload: identity
required_capabilities:
  - conditional_access
severity: medium
value_impact: medium
impact: medium
effort: minutes
blast_radius: all_users
pack: identity
exposure_class: none
deep_link: https://entra.microsoft.com/#view/Microsoft_AAD_IAM/AuthenticationMethodsMenuBlade
collector: graph_auth_methods
remediation: >
  In Entra admin center > Protection > Authentication methods >
  Microsoft Authenticator, set 'Require number matching' to Enabled. The
  setting applies tenant-wide to all Authenticator MFA approvals.
references:
  - https://learn.microsoft.com/entra/identity/authentication/how-to-mfa-number-match
enabled: true
