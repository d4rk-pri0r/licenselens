id: id-ca-high-risk-users
title: High-risk users not blocked by Conditional Access
customer_title: Block accounts Microsoft marks as high risk
customer_summary: >
  Your stronger identity plan can automatically stop accounts that look compromised. If that rule is off, risky accounts may keep working.
customer_next_step: >
  Enforce a Conditional Access policy that blocks high user risk for all users.
description: >
  Identity Protection high user risk should be blocked through Conditional Access.
workload: identity
required_capabilities:
  - identity_protection
severity: high
value_impact: high
impact: high
effort: hours
blast_radius: all_users
pack: identity
exposure_class: none
deep_link: https://entra.microsoft.com/#view/Microsoft_AAD_ConditionalAccess/ConditionalAccessBlade/~/Policies
collector: graph_identity_protection
remediation: >
  Create an enforced Conditional Access policy blocking user risk level High for all users.
references:
  - https://learn.microsoft.com/entra/id-protection/howto-identity-protection-configure-risk-policies
enabled: true
