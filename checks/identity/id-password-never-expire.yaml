id: id-password-never-expire
title: Domain password expiration still enforced
customer_title: Stop calendar-based password expiration
customer_summary: >
  Forcing passwords to change every few months pushes people toward weaker patterns. Prefer strong multi-factor authentication and ban known bad passwords instead.
expected_state: User passwords never expire on verified managed domains.
customer_next_step: >
  Set password validity to never expire on verified managed domains.
why_it_matters: >
  Forced password changes push people toward weak, predictable patterns; strong multi-factor authentication protects far better.
description: >
  User passwords should not expire on a fixed schedule for verified domains.
workload: identity
required_capabilities:
  - conditional_access
severity: low
value_impact: low
impact: low
effort: hours
blast_radius: all_users
pack: identity
exposure_class: none
deep_link: https://entra.microsoft.com/#view/Microsoft_AAD_IAM/ActiveDirectoryMenuBlade/~/Domains
collector: graph_domains
remediation: >
  Set passwordValidityPeriodInDays to never-expire for verified managed domains.
references:
  - https://learn.microsoft.com/microsoft-365/admin/misc/password-policy-recommendations
enabled: true
