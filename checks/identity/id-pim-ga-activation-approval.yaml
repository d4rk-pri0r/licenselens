id: id-pim-ga-activation-approval
title: Global Administrator activation does not require approval
customer_title: Require approval to turn on Global Admin
customer_summary: >
  A second person approving Global Admin activation makes solo account takeover harder.
expected_state: A second approver signs off on every Global Administrator activation.
customer_next_step: >
  Require approval on Global Administrator PIM activation.
description: >
  Activation of Global Administrator should require approval.
workload: identity
required_capabilities:
  - entra_id_p2
severity: high
value_impact: high
impact: high
effort: hours
blast_radius: admin
pack: identity
exposure_class: none
deep_link: https://portal.azure.com/#view/Microsoft_Azure_PIMCommon/CommonMenuBlade/~/quickStart
collector: graph_pim_policies
remediation: >
  Configure PIM role settings so Global Administrator activation requires approval.
references:
  - https://learn.microsoft.com/entra/id-governance/privileged-identity-management/pim-how-to-change-default-settings
mappings:
  nist: ["AC-2", "AC-6"]
  mitre: ["T1078"]
enabled: true
tier: activation
pass_criteria:
  ok: A second approver signs off on every Global Administrator activation.
  partial: The expected state is only partly met.
  gap: The expected state is not met.
  evidence_fields:
    - approval_required_rules
    - ga_rule_count
