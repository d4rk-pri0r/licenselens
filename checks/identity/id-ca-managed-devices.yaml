id: id-ca-managed-devices
title: Managed devices not required by Conditional Access
customer_title: Require company-managed devices for access
customer_summary: >
  Allowing any personal device to reach work apps increases the chance that a lost or infected laptop becomes a foothold.
expected_state: Cloud app access requires a compliant or hybrid-joined managed device.
customer_next_step: >
  Enforce Conditional Access requiring compliant or hybrid-joined devices.
description: >
  Conditional Access should require managed devices for cloud app access.
workload: identity
required_capabilities:
  - conditional_access
  - intune
severity: medium
value_impact: medium
impact: medium
effort: days
blast_radius: all_users
pack: identity
exposure_class: none
deep_link: https://entra.microsoft.com/#view/Microsoft_AAD_ConditionalAccess/ConditionalAccessBlade/~/Policies
collector: graph_ca
remediation: >
  Create an enforced Conditional Access policy requiring compliant or Microsoft Entra hybrid joined devices.
references:
  - https://learn.microsoft.com/entra/identity/conditional-access/howto-conditional-access-policy-compliant-device
mappings:
  nist: ["AC-2", "IA-2"]
  mitre: ["T1078"]
flagship: true
flagship_security_intent: "Require compliant or hybrid-joined managed devices for cloud app access via Conditional Access."
enabled: true
tier: activation
pass_criteria:
  ok: Access to cloud apps requires an Intune-marked or hybrid-joined device for all users.
  partial: A device requirement exists but is limited to some users or some apps.
  gap: Cloud apps can be reached from unmanaged devices.
  evidence_fields:
    - enforced_policies
    - universal_policies
    - scoped_policies
    - scope_gaps_best
    - security_defaults_enabled
    - unjustified_exclusion_issues
