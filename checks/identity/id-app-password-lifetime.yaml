id: id-app-password-lifetime
title: Application password credentials last too long
customer_title: Shorten long-lived app secrets
customer_summary: >
  App secrets that never rotate become permanent keys for attackers if leaked.
expected_state: Application password credentials expire within 180 days.
customer_next_step: >
  Rotate app secrets and keep password credential lifetime at 180 days or less.
description: >
  Application password credentials should not exceed 180 days.
workload: identity
required_capabilities:
  - conditional_access
severity: medium
value_impact: medium
impact: medium
effort: days
blast_radius: admin
pack: identity
exposure_class: none
deep_link: https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade
collector: graph_applications
remediation: >
  Inventory app password credentials and enforce lifetimes of 180 days or less.
references:
  - https://learn.microsoft.com/entra/identity-platform/security-best-practices-for-app-registration
enabled: true
