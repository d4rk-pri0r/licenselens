id: id-guest-inviter-restricted
title: Guest invitations not limited to inviter roles
customer_title: Stop everyone from inviting external guests
customer_summary: >
  When any employee can invite guests, partner sprawl and accidental data sharing grow quickly.
expected_state: Only Guest Inviter role members and admins can invite guests.
customer_next_step: >
  Allow only admins and Guest Inviter role holders to invite guests.
why_it_matters: >
  If any user can invite guests, one careless invite can give an outsider access to internal teams and files.
description: >
  Only users with the Guest Inviter role or admins should invite guest users.
workload: identity
required_capabilities:
  - conditional_access
severity: medium
value_impact: medium
impact: medium
effort: hours
blast_radius: all_users
pack: identity
exposure_class: none
deep_link: https://entra.microsoft.com/#view/Microsoft_AAD_IAM/CompanyRelationshipsMenuBlade
collector: graph_authorization
remediation: >
  Set allowInvitesFrom to adminsAndGuestInviters (or stricter).
references:
  - https://learn.microsoft.com/entra/external-id/external-collaboration-settings-configure
mappings:
  nist: ["AC-2", "AC-3"]
  mitre: ["T1078"]
enabled: true
pass_criteria:
  ok: Only Guest Inviter role members and admins can invite guests.
  partial: The expected state is only partly met.
  gap: The expected state is not met.
  evidence_fields:
    - allow_invites_from
