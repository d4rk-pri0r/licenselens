id: id-dormant-privileged
title: Dormant privileged identities still enabled
customer_title: Powerful accounts that nobody uses are still switched on
customer_summary: >
  Admin or high-privilege accounts that sit unused are favorite targets.
  Attackers love quiet accounts because nobody notices when they suddenly wake up.
customer_next_step: >
  Review enabled admin accounts that have not signed in for a long time;
  disable or remove access you no longer need.
description: >
  Enabled identities holding directory or PIM roles with no successful
  sign-in for a long window are high-value takeover targets and unused
  license surface.
workload: identity
required_capabilities:
  - entra_id_p2
severity: medium
value_impact: medium
impact: medium
effort: days
blast_radius: admin
pack: identity
exposure_class: none
deep_link: https://entra.microsoft.com/#view/Microsoft_AAD_IAM/SignInEventsBlade
collector: graph_signins_roles
remediation: >
  Disable or archive unused privileged accounts, remove unneeded role
  assignments, and prefer just-in-time access via PIM.
references:
  - https://attack.mitre.org/techniques/T1078/004/
enabled: true
