id: id-auth-methods-migration
title: Authentication methods migration not complete
customer_title: Finish consolidating sign-in method settings
customer_summary: >
  Microsoft moved multi-factor and password-reset methods to one policy page. Leaving migration unfinished keeps two places to misconfigure.
customer_next_step: >
  Complete authentication methods migration to Migration Complete.
description: >
  Authentication methods policy migration should be complete.
workload: identity
required_capabilities:
