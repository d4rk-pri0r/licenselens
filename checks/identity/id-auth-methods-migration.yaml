severity: medium
value_impact: medium
impact: medium
effort: hours
blast_radius: all_users
pack: identity
exposure_class: none
deep_link: https://entra.microsoft.com/#view/Microsoft_AAD_IAM/AuthenticationMethodsMenuBlade
collector: graph_auth_methods
remediation: >
  Migrate MFA and SSPR methods to the Authentication methods policy and set migration state to complete.
references:
  - https://learn.microsoft.com/entra/identity/authentication/how-to-authentication-methods-manage
