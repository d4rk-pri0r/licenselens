value_impact: medium
impact: medium
effort: hours
blast_radius: data
pack: power-bi
exposure_class: none
deep_link: https://app.powerbi.com/admin-portal/tenantSettings
collector: power_data_collector
remediation: >
  Enable sensitivity labels in the Power BI admin portal and publish a label policy.
references:
  - https://learn.microsoft.com/power-bi/enterprise/service-security-sensitivity-label-overview
enabled: true
