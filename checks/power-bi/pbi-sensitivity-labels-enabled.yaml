id: pbi-sensitivity-labels-enabled
title: Power BI sensitivity labels are not applied
customer_title: Turn on Power BI sensitivity labels
customer_summary: >
  Sensitivity labels are not applied to Power BI content, so reports may not
  inherit the data classification and protection controls you already pay for.
customer_next_step: >
  Enable sensitivity labels in the Power BI admin portal and publish label policies.
description: >
  Power BI sensitivity labels should be enabled so content inherits classification.
