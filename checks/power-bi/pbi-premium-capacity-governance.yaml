id: pbi-premium-capacity-governance
title: Power BI Premium capacity governance
customer_title: Premium capacity use and capacity admins are checked directly
customer_summary: >
  Premium capacity existence, admin assignments, and tenant settings are read
  directly from the Power BI / Fabric admin REST API, so capacity governance is
  checked automatically.
expected_state: Premium capacities are in use and capacity admins stay limited.
customer_next_step: >
  Confirm Premium per-user or capacity entitlements are assigned intentionally,
  capacity admins are limited, and workspace provenance matches your policy.
description: >
  Premium/Fabric capacities and tenant settings are read directly from the
  Power BI admin REST API (admin/capacities + admin/tenantsettings). Workspace
  mapping and per-user seat provenance still require a portal review.
workload: power_bi
required_capabilities:
  - power_bi_premium
severity: medium
value_impact: medium
impact: medium
effort: hours
blast_radius: data
pack: power-bi
exposure_class: none
deep_link: https://app.powerbi.com/admin-portal/capacities
collector: pbi_capacity_collector
remediation: >
  Review Premium capacity settings and per-user assignments in the Power BI
  admin portal. Limit capacity admins, confirm workspace-to-capacity mapping,
  and document entitlement provenance for licensed seats.
references:
  - https://learn.microsoft.com/power-bi/enterprise/service-premium-what-is
  - https://learn.microsoft.com/power-bi/enterprise/service-premium-per-user-faq
  - https://learn.microsoft.com/rest/api/power-bi/admin
enabled: true
