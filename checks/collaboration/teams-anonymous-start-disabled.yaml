id: teams-anonymous-start-disabled
title: Anonymous users can start meetings
customer_title: Block anonymous users from starting meetings
customer_summary: >
  Anonymous users who start meetings can scrape internal contacts and invite others.
customer_next_step: >
  Turn off 'Anonymous users and dial-in callers can start a meeting'.
description: >
  Anonymous users should not be able to start meetings.
workload: collaboration
required_capabilities:
  - teams
severity: high
value_impact: high
impact: high
effort: hours
blast_radius: all_users
pack: collaboration
exposure_class: none
deep_link: https://admin.teams.microsoft.com
collector: collaboration_collector
remediation: >
  In meeting policies, keep 'Anonymous users can start a meeting' off.
references:
  - https://learn.microsoft.com/microsoftteams/settings-policies-reference
enabled: true
