id: teams-custom-apps-governed
title: Custom app installation is not governed
customer_title: Restrict custom apps to approved ones
customer_summary: >
  Sideloaded custom apps bypass store review and can carry unvetted code.
customer_next_step: >
  Block all custom apps or allow only approved ones.
description: >
  Custom app installation should be limited to agency-approved apps.
workload: collaboration
required_capabilities:
  - teams
severity: medium
value_impact: medium
impact: medium
effort: hours
blast_radius: all_users
pack: collaboration
exposure_class: none
deep_link: https://admin.teams.microsoft.com
collector: collaboration_collector
remediation: >
  Set custom apps to 'Block all apps' or 'Allow specific apps and block all others'.
references:
  - https://learn.microsoft.com/microsoftteams/teams-app-permission-policies
enabled: true
