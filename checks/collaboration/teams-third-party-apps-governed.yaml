id: teams-third-party-apps-governed
title: Third-party app installation is not governed
customer_title: Restrict third-party apps to approved ones
customer_summary: >
  Unvetted third-party apps introduce supply-chain and data-access risk.
customer_next_step: >
  Block all third-party apps or allow only approved ones.
description: >
  Third-party app installation should be limited to agency-approved apps.
workload: collaboration
required_capabilities:
  - teams
severity: medium
value_impact: medium
impact: medium
effort: hours
blast_radius: all_users
pack: collaboration
exposure_class: none
deep_link: https://admin.teams.microsoft.com
collector: collaboration_collector
remediation: >
  Set third-party apps to 'Block all apps' or 'Allow specific apps and block all others'.
references:
