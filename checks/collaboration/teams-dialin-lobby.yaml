id: teams-dialin-lobby
title: Dial-in callers can bypass the meeting lobby
customer_title: Keep dial-in callers in the lobby
customer_summary: >
  Dial-in callers who bypass the lobby reduce control over who joins.
customer_next_step: >
  Turn off 'People dialing in can bypass the lobby'.
description: >
  Dial-in users should not bypass the meeting lobby.
workload: collaboration
required_capabilities:
  - teams
severity: medium
value_impact: medium
impact: medium
effort: hours
blast_radius: all_users
pack: collaboration
exposure_class: none
deep_link: https://admin.teams.microsoft.com
collector: collaboration_collector
remediation: >
  Set 'People dialing in can bypass the lobby' to Off.
references:
  - https://learn.microsoft.com/microsoftteams/settings-policies-reference
enabled: true
